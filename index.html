<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>학습 현황</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#1c1d21;--sub:#6b6d75;--line:#e2e1db;--acc:#7a1f3d;--acc2:#f6e9ee;--box:#efeee8;--ok:#1f8a4c;--ok2:#e2f3e8;--go:#b5560b;--go2:#fdf0e3;--red:#b42318;--red2:#fde8e8;--h0:#f0efe9;--h1:#cfe8d8;--h2:#8fcca6;--h3:#3f9e66;--h4:#1f6b40}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(15px*var(--fz,1))/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:10px 16px 80px}
button{font:inherit;border:0;border-radius:9px;padding:8px 12px;background:var(--box);color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);color:#fff;font-weight:600}
input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.top h1{font-size:calc(20px*var(--fz,1));margin:0 auto 0 0}
.back{display:inline-block;margin:2px 0 6px;color:var(--sub);text-decoration:none;font-size:calc(14px*var(--fz,1))}
.datebar{display:flex;align-items:center;gap:6px}
.datebar b{min-width:118px;text-align:center}
.muted{color:var(--sub);font-size:calc(13px*var(--fz,1))}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.tile .n{font-size:calc(24px*var(--fz,1));font-weight:700;line-height:1.2}.tile .l{font-size:calc(12.5px*var(--fz,1));color:var(--sub)}
.tile.on{outline:2px solid var(--acc)}
.tabs{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.tabs button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.gh{font-weight:700;margin:14px 2px 6px;font-size:calc(14px*var(--fz,1));color:var(--acc)}
.row{display:grid;grid-template-columns:200px 1fr 190px 112px;gap:10px;align-items:center;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 6px;cursor:pointer}
.row:hover{border-color:#c9a7b3}
.nm b{font-size:calc(15.5px*var(--fz,1))}.nm .muted{display:block;font-size:calc(12px*var(--fz,1))}
.bar{height:8px;background:var(--box);border-radius:5px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-block;font-size:calc(12px*var(--fz,1));padding:1px 7px;border-radius:20px;background:var(--box);color:var(--sub);white-space:nowrap}
.chip.ok{background:var(--ok2);color:var(--ok)}.chip.go{background:var(--go2);color:var(--go)}.chip.no{background:var(--red2);color:var(--red)}
.heat{display:flex;gap:2px}.heat span{width:14px;height:14px;border-radius:3px;background:var(--h0);font-size:calc(9px*var(--fz,1));line-height:14px;text-align:center;color:#fff}
.heat span.t{outline:1.5px solid var(--acc);outline-offset:0}
.l0{background:var(--h0)!important}.l1{background:var(--h1)!important;color:#245!important}.l2{background:var(--h2)!important}.l3{background:var(--h3)!important}.l4{background:var(--h4)!important}
.last{text-align:right;font-size:calc(13px*var(--fz,1))}
table{border-collapse:collapse;width:100%;font-size:calc(13.5px*var(--fz,1))}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
th{font-size:calc(12.5px*var(--fz,1));color:var(--sub);font-weight:600;background:#faf9f6;position:sticky;top:0}
td.num,th.num{text-align:right}
.grid{overflow-x:auto}
.grid td.c{width:30px;text-align:center;padding:4px 2px}
.grid td.c span{display:inline-block;min-width:24px;height:22px;line-height:22px;border-radius:5px;font-size:calc(12px*var(--fz,1));background:var(--h0);color:var(--ink)}
.grid tr:hover td{background:#fbf7f8}
.grid td.nmc{white-space:nowrap;cursor:pointer}
.task{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}
.ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:calc(13px*var(--fz,1));color:#fff;margin-top:2px}
.ck.on{background:var(--ok);border-color:var(--ok)}
.tag{display:inline-block;font-size:calc(11.5px*var(--fz,1));padding:0 6px;border-radius:5px;margin-right:5px;background:var(--acc2);color:var(--acc);font-weight:600}
.tk .d{font-size:calc(12.5px*var(--fz,1));color:var(--sub)}
.sec{font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details summary{cursor:pointer;color:var(--sub);font-size:calc(12.5px*var(--fz,1))}
pre{white-space:pre-wrap;font:calc(12.5px*var(--fz,1))/1.5 inherit;margin:4px 0;background:#faf9f6;padding:6px 8px;border-radius:6px}
.err{color:var(--red);font-size:calc(14px*var(--fz,1));margin:6px 0}
.spark{width:100%;height:70px}
.note{font-size:calc(12.5px*var(--fz,1));color:var(--sub);margin:6px 2px}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}.filt button{padding:5px 10px;font-size:calc(13px*var(--fz,1))}.filt button.on{background:var(--ink);color:#fff}
@media (max-width:760px){
 .tiles{grid-template-columns:repeat(2,1fr)}
 .row{grid-template-columns:1fr auto;gap:4px 10px}
 .row .hc{grid-column:1/-1}.row .tc{grid-column:1/-1}
 .two{grid-template-columns:1fr}
}
.hd{display:flex;gap:12px;align-items:center;margin:2px 0 4px}.av{width:62px;height:62px;border-radius:16px;background:var(--box);flex:none;display:grid;place-items:center;overflow:hidden;font-size:calc(26px*var(--fz,1));font-weight:700;color:var(--sub)}.av img{width:100%;height:100%;object-fit:contain}.hd h2{font-size:calc(20px*var(--fz,1));margin:0;line-height:1.3}
.nmc{display:flex;align-items:center;gap:8px}.nmc>div{display:flex;flex-direction:column;min-width:0}.nav{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:#f1f0ec}.nav0{display:flex;align-items:center;justify-content:center;font-weight:800;color:#888;font-size:calc(13px*var(--fz,1))}
.row.fresh{background:#fff8db;box-shadow:inset 4px 0 0 #f59f00}
/* 11-09 일정표(선생님 앱 「일정표」와 같은 달력 — 학생 화면 캐릭터 칸 바로 아래) */
/* 굿노트 월간 일정표(선생님 앱 「일정표」·오늘 할 일 앱 공용, 2026-11-09) */
.gc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gc{background:#fff;color:#222;border:1px solid #d9d9d4;border-radius:12px;padding:16px 22px 24px;color-scheme:light;container-type:inline-size;min-width:700px;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
/* 캐릭터만 오른쪽 위에 고정(높이 0인 sticky 상자 — 자리를 차지하지 않는다) */
.gc-ch-fix{position:sticky;top:calc(var(--ink-h,0px) + var(--gc-top,0px) + 6px);height:0;z-index:5;display:flex;justify-content:flex-end;padding-right:10px;pointer-events:none}
.gc-ch-fix img{height:84px;max-width:120px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.gc-ch-fix{align-items:flex-start;gap:6px}
.gc-ch-row{display:flex;align-items:flex-start;gap:10px;margin:0 0 8px;padding:8px 10px;background:#fff;border:1px solid #d9d9d4;border-radius:12px;color-scheme:light}
.gc-ch-row img{height:84px;max-width:120px;object-fit:contain;flex:none;margin-left:auto}
.gc-ch-row .gc-rng{max-width:none;flex:1;margin-top:0}
.gc-ch-row .gc-rb{max-width:none;box-shadow:none;background:#fafaf7}
.gc-rng{display:flex;gap:5px;align-items:stretch;margin-top:6px;max-width:min(78cqw,760px);pointer-events:auto}
.gc-rb{background:rgba(255,255,255,.94);border:1px solid #d9d9d4;border-radius:8px;padding:5px 8px;font-size:calc(11px*var(--fz,1));font-size:clamp(10px,1.0cqw,12px);line-height:1.35;color:#333;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 2px 6px rgba(0,0,0,.12);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;flex:1 1 0;min-width:120px;max-width:300px}
.gc-rb b{display:block;color:#2f3a5c;margin-bottom:2px}
.gc-rb div{padding-left:7px;text-indent:-7px}
.gc-rb div::before{content:"· "}
.gc-wrap{container-type:inline-size}
.gc-wd{background:#edf2ff;border-radius:8px 8px 0 0;padding:7px 0 5px;margin-top:2px}
.gc-wm{text-align:center;letter-spacing:.35em;padding-left:.35em;font-weight:500;font-size:calc(14px*var(--fz,1));font-size:clamp(13px,1.7cqw,19px);color:#2f3a5c;padding-bottom:4px}
.gc-wn{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:calc(9.5px*var(--fz,1));font-size:clamp(8.5px,1.1cqw,11.5px);letter-spacing:.28em;color:#3b4252;font-weight:600;text-align:center}
.gc-wn span:first-child{color:#d0342c}.gc-wn span:last-child{color:#1e66f5}
.gc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1.5px solid #bdbdbd;border-left:1.5px solid #bdbdbd}
.gc-c{position:relative;min-height:84px;min-height:clamp(78px,10.2cqw,116px);border-right:1.5px solid #bdbdbd;border-bottom:1.5px solid #bdbdbd;padding:27px 6px 7px 10px}
.gc-n{position:absolute;left:9px;top:6px;font-style:normal;font-size:calc(11px*var(--fz,1));letter-spacing:.1em;color:#555;z-index:0}
.gc-n[class*=gc-m-]::before{content:"";position:absolute;left:-7px;top:0;width:25px;height:17px;border-radius:3px 3px 14px 14px;z-index:-1}
.gc-m-y::before{background:#fff35c}.gc-m-p::before{background:#ff8cc6}.gc-m-g::before{background:#b9ff5a}
.gc-k-g{background:#f1ffd9}
.gc-k-p{background:#ffe3f0}   /* 시험 날 칸(11-10 사용자: 「그 날의 칸은 색을 넣어」) */
.gc-out{background:#fafaf8}
.gc-t{font-size:calc(14px*var(--fz,1));font-size:clamp(11.5px,1.6cqw,17px);line-height:1.35;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.gc-today{box-shadow:inset 0 0 0 2.5px #2f5bd3}
.gc-ok{color:#1a7f4b;font-weight:600}   /* 해석시험 통과(✔ 줄, 조교 앱이 기입) */
.gc-ai{color:#1e66f5}   /* Claude가 쓴 일정(§ 줄) */
.gc-sel{background:#e8eefc}
.gc-edit .gc-c,.gc-edit .gc-note{cursor:pointer}
.gc-edit .gc-c:hover{background:#f3f7ff}
.gc-wait{opacity:.55}
.gc-month{scroll-margin-top:calc(var(--ink-h,0px) + var(--gc-top,0px) + 8px)}
.gc-year .gc-month + .gc-month{margin-top:12px;padding-top:2px;border-top:2px dashed #c9c9c3}

.tsbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tsbar b{min-width:110px;text-align:center}
.tsbar button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 12px;cursor:pointer}
#tsStamp{font-size:calc(13px*var(--fz,1));color:var(--sub)}#tsStamp.ng{color:#c8372d;font-weight:700}#tsStamp.ok{color:#1f8a4c}
.ed{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ed[hidden]{display:none}
.ed-box{background:var(--card);border-radius:16px;padding:18px;width:min(560px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.ed-box button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 13px;cursor:pointer}
.ed-box button.pri{background:var(--acc,#2f5bd3);border-color:var(--acc,#2f5bd3);color:#fff;font-weight:700}
.ed-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:calc(18px*var(--fz,1))}
.ed-h button{border:0;font-size:calc(19px*var(--fz,1));padding:4px 10px}
#edTx{width:100%;font:inherit;font-size:calc(18px*var(--fz,1));line-height:1.45;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafaf7;color:#1c1d21;resize:vertical;min-height:130px}
.ed-m{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.ed-m button{color:#1c1d21}
.ed-m button.on{outline:2.5px solid var(--acc,#2f5bd3);outline-offset:1px;font-weight:700}
.ed-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
<!--pwa-->
<link rel="icon" href="/icon-192.png?v=e1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=e1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학습현황">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<script>/* 홈 화면 앱(pwa.py): 아이폰이 아니면 manifest를 건다 · 주소의 ?dv=기기ID 는 저장된 ID가 없을 때만 받는다 */
(function () {
  var K = "leess-dash:device", ua = navigator.userAgent;
  var ios = /iP(hone|ad|od)/.test(ua) || (!/Android/i.test(ua) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l); }
  try {
    var q = new URLSearchParams(location.search), dv = q.get('dv');
    if (dv === null && !q.has('openExternalBrowser')) return;
    var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    var inapp = /KAKAOTALK|\bLine\//i.test(ua);
    if (dv && /^[0-9a-f]{8}$/i.test(dv) && (app || (q.get('via') === 'out' && !inapp)) && !localStorage.getItem(K)) localStorage.setItem(K, JSON.stringify(dv));
    ['dv', 'via', 'openExternalBrowser'].forEach(function (k) { q.delete(k); });
    var s = q.toString();
    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
  } catch (e) {}
})();
</script>
<style id="ipadCss">
/* 아이패드 기준 화면(2026-11-09) — 폭 740px 이상(아이패드 세로·가로, 컴퓨터)에서 본문 폭을 넓히고 글자를 키운다. 휴대폰은 그대로. */
@media (min-width:740px) and (min-height:560px){
:root{--fz:1.22}

.wrap{padding-left:26px!important;padding-right:26px!important}
.brand img{max-width:640px!important}
input[type=radio],input[type=checkbox]{width:19px;height:19px}
.lock,.gate{max-width:600px!important}
#pwaSheet .pwa-box{max-width:620px!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>학습 현황</h1>
    <div class="datebar"><button id="prev" aria-label="전날">‹</button><b id="dlabel"></b><button id="next" aria-label="다음 날">›</button><button id="today">오늘</button></div>
    <button class="pri" id="reload">새로고침</button>
  </div>
  <div class="muted" id="stamp"></div>
  <div id="login" class="card" hidden>
    <div class="sec">선생님 코드</div>
    <p class="muted" style="margin:0 0 8px">선생님 앱과 같은 코드입니다. 이 기기에만 저장됩니다.</p>
    <div style="display:flex;gap:8px"><input id="code" type="password" autocomplete="off"><button class="pri" id="codeGo">확인</button></div>
    <div class="err" id="codeMsg"></div>
  </div>
  <div id="main" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>
<div class="ed" id="ed" hidden><div class="ed-box">
  <div class="ed-h"><b id="edT"></b><button id="edX" aria-label="닫기">✕</button></div>
  <textarea id="edTx" rows="5" placeholder="일정을 적습니다. 줄을 바꿔 여러 개를 적을 수 있습니다."></textarea>
  <div class="ed-m" id="edM"><button data-m="">자동</button><button data-m="n">표시 없음</button><button data-m="y" style="background:#fff9b0">수업</button><button data-m="p" style="background:#ffd3ea">시험</button><button data-m="g" style="background:#dcffad">시험기간</button></div>
  <div class="ed-b"><button id="edCopy">복사</button><button id="edPaste">붙여넣기</button><span style="flex:1"></span><button id="edDel">비우기</button><button class="pri" id="edOk">저장</button></div>

const avg = a => a.length ? Math.round(a.reduce((s, x) => s + x, 0) / a.length) : null;

async function openBlob(hex, b64) {
  const key = await crypto.subtle.importKey('raw', Uint8Array.from(hex.match(/../g), x => parseInt(x, 16)), 'AES-GCM', false, ['decrypt']);
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: raw.slice(0, 12)}, key, raw.slice(12));
  return JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}

// 서버 기록 → 이름별 [{t,k,app,range,score,correct,total,wrong,dur,pass,items}]
function index(rows) {
  BY = {}; CK = {};
  for (const r of rows) {
    const x = {t: r[0], k: r[1], name: r[2], app: r[3], range: r[4] || '', score: r[5], correct: r[6], total: r[7], wrong: r[8] || '', dur: r[9] || '', pass: r[10] || '', items: r[11] || ''};
    (BY[x.name] = BY[x.name] || []).push(x);
  }
  for (const n in BY) {
    BY[n].sort((a, b) => a.t < b.t ? -1 : 1);
    const c = {};
    for (const x of BY[n]) if (x.k === 'c') {   // 「오늘 할 일 체크 2026-11-01 hw:교재 완료」
      const m = x.range.match(/^오늘 할 일 체크 (\d{4}-\d\d-\d\d) (.+) (완료|취소)$/); if (!m) continue;
      c[m[1]] = c[m[1]] || {}; if (m[3] === '완료') c[m[1]][m[2]] = 1; else delete c[m[1]][m[2]];
    }
    CK[n] = c;
  }
}

function srvLogs(r) { const a = A(r); if (!a) return []; return G(S.n).filter(x => x.app === a.t).map(x => ({at: x.t, score: x.score, key: x.range}));   /* 11-04 오늘 할 일의 묶음별 체크(keyHit)가 쓴다 */ }
function srvWbs(r) {
  const a = A(r), out = {}; if (!a) return out;
  for (const x of BY[S.n] || []) {
    if ((x.k !== 'g' && x.k !== 's') || x.app !== a.t) continue;
    const m = x.range.match(/^(.*?) · WB(\d+) .*\((1차|고쳐 풀기|완료)\)$/); if (!m) continue;
    const pid = (a.rn || {})[m[1]] || m[1];

    ((out[pid] = out[pid] || {st: {}}).st)[m[2]] = {stage: 2, at: x.t};
  }
  return out;
}
function tasks(n, day) {

}

function stat(n, day) {

  const wk = []; for (let i = 6; i >= 0; i--) { const d = addD(day, -i); wk.push([d, gDay(n, d).length]); }
  return {n, T, done: T.filter(t => t.ok).length, g, best: g.length ? Math.max(...g.map(x => +x.score || 0)) : null, last, wk, open: opened(n, day),
    idle: !last || (pd(day) - pd(last.slice(0, 10))) / 864e5 >= 3};
}

function spark(L) {
  if (L.length < 2) return '';
  const W0 = 600, H0 = 70, xs = i => 6 + i * (W0 - 12) / (L.length - 1), ys = v => H0 - 6 - (v / 100) * (H0 - 12);
  const p = L.map((x, i) => `${xs(i).toFixed(1)},${ys(+x.score || 0).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W0} ${H0}" preserveAspectRatio="none"><line x1="0" x2="${W0}" y1="${ys(90)}" y2="${ys(90)}" stroke="#1f8a4c" stroke-dasharray="4 4" stroke-width="1"/><polyline points="${p}" fill="none" stroke="#7a1f3d" stroke-width="2"/>${L.map((x, i) => `<circle cx="${xs(i).toFixed(1)}" cy="${ys(+x.score || 0).toFixed(1)}" r="2.6" fill="${+x.score >= 90 ? '#1f8a4c' : '#b5560b'}"><title>${esc(x.t)} ${esc(sname(x.app))} ${x.score}점</title></circle>`).join('')}</svg>`;
}

  h += `<div class="card" style="padding:12px"><div class="tsbar"><span class="sec" style="margin:0">일정표</span><span id="tsStamp"></span><span style="flex:1"></span><button data-tsm="-1">‹ 이전 달</button><b id="tsLab"></b><button data-tsm="1">다음 달 ›</button><button data-tsm="0">이번 달</button></div><div id="tsCal"></div><div class="muted" style="margin-top:8px">칸을 누르면 그날 일정을 고칩니다. 고친 내용은 바로 저장되어 학생의 오늘 할 일 앱에 보입니다. 1년 전체는 선생님 앱 「일정표」에서.</div></div>`;   /* 11-09 사용자: 캐릭터 바로 아래 일정표, 그 아래는 그대로 */
  h += `<div class="two"><div class="card"><div class="sec"><span>${md(DAY)} 오늘 할 일</span><span class="muted">${T.filter(t => t.ok).length}/${T.length}${opened(n, DAY) ? ' · 앱 열어 봄' : ''}</span></div>${T.length ? T.map(t => `<div class="task"><span class="ck${t.ok ? ' on' : ''}">${t.ok ? '✓' : ''}</span><div class="tk"><div><span class="tag">${esc(t.tag[0])}</span>${esc(t.t)}</div>${t.man ? `<div class="d">${t.ok ? '학생이 직접 체크함 ✓' : '학생 직접 체크 칸 — 아직 안 누름'}</div>` : t.chip ? `<div class="d">${esc(t.chip[1])}</div>` : ''}</div></div>`).join('') : '<div class="muted">이날 할 일이 없습니다.</div>'}</div>`;
  const days = []; for (let i = 27; i >= 0; i--) days.push(addD(DAY, -i));
  h += `<div class="card"><div class="sec"><span>최근 4주</span><span class="muted">${all.length}회(60일)</span></div><div class="heat" style="flex-wrap:wrap;gap:3px">${days.map(d => { const c = gDay(n, d).length; return `<span class="${lvl(c)}${d === DAY ? ' t' : ''}" style="width:22px;height:22px;line-height:22px;font-size:calc(11px*var(--fz,1))" title="${d} ${c}회">${c || ''}</span>`; }).join('')}</div>
    <div style="margin-top:10px" class="muted">점수 추이(최근 40회, 점선 90점)</div>${spark(all.slice(-40)) || '<div class="muted">기록이 2회 미만입니다.</div>'}</div></div>`;
  const ap = {}; for (const x of all) { const a = ap[x.app] = ap[x.app] || {s: [], last: '', p90: 0}; a.s.push(+x.score || 0); a.last = x.t; if (+x.score >= 90) a.p90++; }
  const wt = {}; for (const x of all) for (const p of x.wrong.split(' · ')) { const m = p.match(/^(.+?) (\d+)$/); if (m && +m[2] > 0) wt[m[1]] = (wt[m[1]] || 0) + +m[2]; }
  h += `<div class="two"><div class="card grid"><div class="sec">앱별 기록(60일)</div><table><tr><th>앱</th><th class="num">응시</th><th class="num">평균</th><th class="num">최고</th><th class="num">90+</th><th>마지막</th></tr>${Object.entries(ap).sort((a, b) => a[1].last < b[1].last ? 1 : -1).map(([t, a]) => `<tr><td>${esc(sname(t))}</td><td class="num">${a.s.length}</td><td class="num">${avg(a.s)}</td><td class="num">${Math.max(...a.s)}</td><td class="num">${a.p90}</td><td class="muted">${esc(ago(a.last))}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">기록 없음</td></tr>'}</table></div>
    <div class="card"><div class="sec">많이 틀린 유형(60일)</div>${Object.entries(wt).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) => `<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>${esc(k)}</span><b>${v}</b></div>`).join('') || '<div class="muted">기록 없음</div>'}</div></div>`;

  const rec = all.slice(-10).reverse();   // 11-06 사용자: 최근 기록 10건
  h += `<div class="card grid"><div class="sec">최근 기록 ${rec.length}건</div><table><tr><th>시각</th><th>앱 · 범위</th><th class="num">점수</th><th>틀린 유형</th></tr>${rec.map(x => `<tr><td class="muted" style="white-space:nowrap">${esc(x.t.slice(5))}</td><td>${esc(sname(x.app))}<div class="muted">${esc(x.range)}${x.dur ? ' · ' + esc(x.dur) : ''}</div>${x.items ? `<details><summary>틀린 문제 보기</summary><pre>${esc(x.items)}</pre></details>` : ''}</td><td class="num"><b style="color:${+x.score >= 90 ? 'var(--ok)' : +x.score >= 70 ? 'var(--go)' : 'var(--red)'}">${x.score}</b></td><td class="muted">${esc(x.wrong)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">기록 없음</td></tr>'}</table></div>`;

}

// ── 11-09 일정표(선생님 앱 「일정표」와 같은 저장 방식): 서버 시트 「일정표」의 고친 칸(TOV)을 학생 자료의 바탕(ST[n].cal) 위에 덮는다 ──
const TQK = 'leess-sched:q';   // 일정표 앱과 같은 보관함(같은 기기에서 못 올린 수정은 어느 쪽에서든 다시 올라간다)
let TOV = {}, TQ = [], tsM = '', tsWho = '', tsOld = false, tsKey = '', tsMark = '', tsClip = '', tsBusy = false, tsMsg = ['', ''];
try { TQ = JSON.parse(lsGet(TQK) || '[]'); } catch (e) { TQ = []; }
const tsSaveQ = () => lsSet(TQK, TQ.length ? JSON.stringify(TQ) : '');
const tsPut = (n, d, t, m) => { (TOV[n] = TOV[n] || {})[d] = [t, m || '']; };
const tsStamp = (t, c) => { tsMsg = [t, c || '']; const e = $('#tsStamp'); if (e) { e.textContent = t; e.className = c || ''; } };
async function tsLoad(code) {

    const t = await (await fetch(DD.url + '?sched=' + encodeURIComponent(code))).text(); let r;
    try { r = JSON.parse(t); } catch (e) { tsOld = true; return; }
    if (!r.ok) return;
    tsOld = false; TOV = {};
    for (const x of r.rows) tsPut(x[0], x[1], x[2], x[3]);
    for (const x of TQ) tsPut(x[0], x[1], x[2], x[3]);
  } catch (e) {}
}
function tsPaint() {
  const box = $('#tsCal'); if (!box || !ST[who]) return;
  const s = ST[who], ov = TOV[who] || {}, dows = (s.days || []).map(d => d[0]), w = {};
  if (!tsM) tsM = ymd(new Date()).slice(0, 7);
  for (const x of TQ) if (x[0] === who) w[x[1]] = 1;
  $('#tsLab').textContent = `${tsM.slice(0, 4)}년 ${+tsM.slice(5)}월`;   /* 11-10 사용자: 학습 현황에서는 해당 달만(아래 볼 내용이 많다) — 1년 스크롤은 일정표 앱·학생 앱에서 */
  const o = {ym: tsM, cell: d => gcCell(d, s.cal, ov, dows), ch: s.ch, rng: s.cal && s.cal.rng, inline: true, today: ymd(new Date()), edit: true, wait: w, key: who};   /* inline: 시험범위·캐릭터를 달력 위 칸에(11-10 사용자: 겹쳐서 보기 힘들다) */
  gcPatch(box, gcHTML(o)); gcBindHead(box.querySelector('.gc-wrap'), o);   /* 11-10 바뀐 칸만 갈아 끼움 — 저장해도 보던 자리 그대로 */
  tsStamp(tsMsg[0] || (tsOld ? '서버 배포 전 — 보기만 가능' : ''), tsMsg[1] || (tsOld ? 'ng' : ''));
}
function tsOpen(key) {
  const s = ST[who], ov = TOV[who] || {}, isNote = key.length === 7; tsKey = key;
  if (isNote) { $('#edT').textContent = `${who} · ${+key.slice(5)}월 시험범위 메모`; $('#edTx').value = gcNote(key, s.cal, ov); tsMark = ''; }
  else { const d = pd(key); $('#edT').textContent = `${who} · ${d.getMonth() + 1}월 ${d.getDate()}일 ${W[d.getDay()]}요일`; $('#edTx').value = gcCell(key, s.cal, ov, []).t; tsMark = ov[key] ? ov[key][1] || '' : ''; }
  $('#edM').hidden = isNote; $('#edPaste').disabled = !tsClip; tsMarks(); $('#ed').hidden = false; setTimeout(() => $('#edTx').focus(), 30);
}
const tsMarks = () => document.querySelectorAll('#edM button').forEach(b => b.classList.toggle('on', b.dataset.m === tsMark));
const tsClose = () => { $('#ed').hidden = true; tsKey = ''; };
function tsCommit(text) {
  const row = [who, tsKey, text.replace(/\s+$/, ''), tsKey.length === 7 ? '' : tsMark];
  tsPut(...row); TQ = TQ.filter(x => !(x[0] === row[0] && x[1] === row[1])); TQ.push(row); tsSaveQ();
  tsClose(); tsPaint(); tsFlush();
}
async function tsFlush() {
  if (tsBusy || !TQ.length) return;
  if (tsOld) { tsStamp(`서버 배포 전 — 이 기기에 임시 보관 ${TQ.length}건`, 'ng'); return; }
  tsBusy = true; tsStamp(`저장 중… ${TQ.length}건`);
  const send = TQ.slice(); let ok = false;
  try {
    const r = JSON.parse(await (await fetch(DD.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({event: 'sched', code: getCode(), rows: send})})).text());
    if (!r.ok) throw new Error(r.error || 'fail');
    TQ = TQ.filter(x => !send.includes(x)); tsSaveQ(); ok = true;
    tsStamp(`저장됨 ${(r.at || '').slice(11)} — 학생 앱 과제에는 1~3분 뒤 반영`, 'ok');
  } catch (e) { tsStamp(`저장 안 됨 ${TQ.length}건 — 인터넷을 확인하고 새로고침을 누르십시오(내용은 이 기기에 남아 있습니다)`, 'ng'); }
  tsBusy = false; tsPaint();
  if (ok && TQ.length) tsFlush();

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-tsm]');
  if (nav) { const v = +nav.dataset.tsm; if (!v) tsM = ymd(new Date()).slice(0, 7); else { const d = new Date(+tsM.slice(0, 4), +tsM.slice(5) - 1 + v, 1); tsM = ymd(d).slice(0, 7); } tsPaint(); return; }
  const m = e.target.closest('#edM button'); if (m) { tsMark = m.dataset.m; tsMarks(); return; }

  if (e.target.id === 'edCopy') { tsClip = $('#edTx').value; $('#edPaste').disabled = !tsClip; return; }
  if (e.target.id === 'edPaste') { const t = $('#edTx'); t.value = t.value ? t.value.replace(/\s+$/, '') + '\n' + tsClip : tsClip; t.focus(); return; }

document.addEventListener('keydown', e => { if ($('#ed').hidden) return; if (e.key === 'Escape') tsClose(); if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) tsCommit($('#edTx').value); });

async function load(force) {
  const code = getCode();

  $('#stamp').textContent = '기록을 불러오는 중… (10초쯤 걸립니다)';
  let r, txt = '';
  try { txt = await (await fetch(DD.url + '?dash=' + encodeURIComponent(code) + '&days=60')).text(); }
  catch (e) { $('#stamp').textContent = '서버에 연결하지 못했습니다. 인터넷을 확인하고 새로고침을 누르세요.'; return; }

  catch (e) { $('#stamp').textContent = /수집 스크립트/.test(txt) ? '채점 서버가 아직 옛 판입니다. 「시험앱 공용 서버 코드(학습 현황)_2026-11-01」 파일로 서버를 새 버전 배포한 뒤 새로고침을 누르세요.' : '서버 응답을 읽지 못했습니다. 잠시 뒤 새로고침을 누르세요.'; return; }

    $('#stamp').textContent = '서버 오류: ' + (r.error || '알 수 없음') + ' — 서버가 11-01 판으로 배포됐는지 확인하세요.'; return;

/* 11-06 사용자: 「1분 30초마다가 아니라 시험 보자마자 신호를 받아 즉시 새로 불러오게」 — 채점 서버가 기록 직후 ntfy.sh 비밀 주제로 빈 신호를 보내고(이름·점수 없음),
   여기서 EventSource로 받아 바로 load(). 주제는 선생님 코드로 연 서버 응답(r.push)으로만 받는다. 신호 연결이 끊겼을 때만 90초 예비 새로고침. */
let ES = null, ET = 0, LIVE = false;
function listen(topic) {
  if (ES || !topic || !window.EventSource) return;
  ES = new EventSource('https://ntfy.sh/' + encodeURIComponent(topic) + '/sse');
  ES.onopen = () => { LIVE = true; };
  ES.onerror = () => { LIVE = false; };
  ES.onmessage = () => { clearTimeout(ET); ET = setTimeout(() => { if (!$('#main').hidden) load(); }, 800); };
}
setInterval(() => { if (!LIVE && !document.hidden && view === 'today' && DAY === ymd(new Date()) && !$('#main').hidden) load(); }, 90000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#main').hidden && SRV) load(); });
/* 11-07: 앱이 예전 화면을 메모리에 들고 있으면(옛 캐릭터 등) 새 빌드가 있을 때 새로 불러온다 */
async function newBuild() { try { const t = await (await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'})).text(); const m = t.match(/"built": "([^"]+)"/); if (m && m[1] !== DD.built) location.replace(location.pathname + '?b=' + encodeURIComponent(m[1]) + location.hash); } catch (e) {} }
window.addEventListener('pageshow', newBuild); document.addEventListener('visibilitychange', () => { if (!document.hidden) newBuild(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-f],[data-v],[data-who]'); if (!t) return;
  if (t.dataset.who) { e.preventDefault(); who = t.dataset.who; view = 'student'; }
  else if (t.dataset.f) { filt = t.dataset.f; view = 'today'; }
  else if (t.dataset.v) view = t.dataset.v;
  render(); window.scrollTo(0, 0);

$('#prev').onclick = () => { DAY = addD(DAY, -1); render(); };
$('#next').onclick = () => { if (DAY < ymd(new Date())) { DAY = addD(DAY, 1); render(); } };

$('#codeGo').onclick = () => { const v = $('#code').value.trim(); if (!v) return; setCode(v); $('#codeMsg').textContent = ''; load(true); };

if (!(window.crypto && crypto.subtle && typeof DecompressionStream !== 'undefined')) $('#stamp').textContent = '이 브라우저에서는 열 수 없습니다. 사파리·크롬 최신판으로 여세요.';

      else if (d.a === 'pad') { const c = last && all.has(last) ? last : null; if (!c || c.kind === 'img') { status(c ? '쪽 그림에는 여백을 넣을 수 없습니다' : '여백을 넣을 곳에 먼저 펜을 대세요'); return; } c.q.pad = (c.q.pad || 0) + PAD; ensurePad(c); paint(c); host.save(c); c.pad.scrollIntoView({block: 'nearest', behavior: 'smooth'}); return; }
      keep(); paintBar(); if (ta) ta.el.focus();
    });
    return b;
  }

  return {
    init(h) { host = h; }, mount, unmount, setRecord, bar, status,
    repaint(c) { paint(c); if (sel && sel.c === c) drawSel(); }, refit(c) { fit(c); paint(c); },
    reset() { if (act) discard(); closeText(); clearSel(); undo = []; redo = []; last = null; paintBar(); },
    busy: () => !!act, cancel() { if (act) discard(); }, cards: () => all.size,
    valid: s => s && (s.t ? typeof s.txt === 'string' && Array.isArray(s.p) : Array.isArray(s.p) && s.p.every(Number.isFinite)),
  };
})();

/* 범용 필기 연결(inkpage.js, 2026-11-10) — ink.js 엔진을 시험앱 전용 필기(inknote.js)를 끼울 수 없는 모든 화면에 붙인다:
   교재·지문분석(article), EBS·수업관리 시험(#qs), 워크북(#stepBox·#exs), 교사용 교재(.page 쪽 그림), 최종정리(#root).
   화면 코드는 고치지 않고 body 변화를 보고 스스로 붙는다. 저장은 기기 IndexedDB(획만). 글 카드는 내용 해시로, 쪽 그림은 쪽 번호로, 교재 지문은 id로 찾는다.
   휴대폰(640 이하)과 넓은 화면은 글 배치가 달라 따로 저장. */
(() => {
  if (window.BOOKNOTE || document.getElementById('noteJs') || typeof INK === 'undefined') return;   // 시험앱 전용 필기가 있으면 그쪽이 맡는다
  const DBN = 'exnote', ST = 'rounds', OLD = 200 * 864e5, $ = s => document.querySelector(s);
  let salt0 = ''; try { if (typeof D !== 'undefined' && D && D.salt) salt0 = String(D.salt); } catch (e) {}
  const BOOK = new URLSearchParams(location.search).get('b') || '';
  const SALT = 'book:' + (salt0 || location.pathname.replace(/[^/]*$/, '')), PAGE = (location.pathname.split('/').pop() || 'guide').replace(/\.html$/, ''), NARROW = matchMedia('(max-width:640px)');

  /* ── 저장소 ── */
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((ok, no) => {
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ST, {keyPath: 'id'}).createIndex('salt', 'salt');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  async function tx(mode, f) { const d = await open(); return new Promise((ok, no) => { const t = d.transaction(ST, mode), rq = f(t.objectStore(ST)); let out; if (rq) rq.onsuccess = () => { out = rq.result; }; t.oncomplete = () => ok(out); t.onerror = t.onabort = () => no(t.error); }); }
  const recs = new Map(), dirty = new Set();
  async function load() {
    try {
      const all = await tx('readonly', s => s.index('salt').getAll(SALT)), now = Date.now(), old = [];
      all.forEach(r => { if (r.at && now - r.at > OLD) old.push(r.id); else recs.set(r.id, r); });
      if (old.length) tx('readwrite', s => { old.forEach(id => s.delete(id)); }).catch(() => {});   // 200일 넘게 손대지 않은 필기는 치운다
    } catch (e) {}
  }
  let cards = new Map(), cand = new Map(), timer = 0, stimer = 0;
  async function flush() {
    clearTimeout(timer); timer = 0; const list = [...dirty]; dirty.clear();
    try { for (const q of list) { await tx('readwrite', s => q.s.length ? s.put(q) : s.delete(q.id)); } if (list.length) INK.status('저장됨'); }
    catch (e) { INK.status('저장 실패'); }
  }
  function save(q) { dirty.add(q); q.at = Date.now(); if (q.s.length) recs.set(q.id, q); else recs.delete(q.id); INK.status('저장 중…'); clearTimeout(timer); timer = setTimeout(flush, 1000); }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  /* ── 어디에 붙나 ── */
  const SKIP = '.top,.bot,.panel,nav,header,footer,script,style,svg,[hidden],.ink-x,.ink-pad', INKSEL = '.ink-l,.ink-x,.ink-pad,#inkBar,#inkTop,#inkLive';
  function candidates() {
    const out = new Map(), add = (els, kind) => { for (const el of els) if (el.nodeType === 1 && !out.has(el)) out.set(el, kind); };
    const qs = $('#qs'); if (qs) add(qs.children, 'text');
    const exs = $('#exs'); if (exs) add(exs.children, 'text');
    const sb = $('#stepBox'); if (sb && [...sb.children].some(x => !x.matches(INKSEL))) add([sb], 'text');
    const app = $('#app');
    if (app) {
      const arts = app.querySelectorAll('main > article');
      if (arts.length) add(arts, 'book');
      else { const pg = app.querySelectorAll('.page'); if (pg.length) add(pg, 'img'); else add(kids(app), 'text'); }
    }
    const root = $('#root'); if (root) add(kids(root), 'text');
    const view = $('#view') || $('#main'); if (view && !app && !root) add(kids(view), 'text');   // 11-10 통합앱·선생님 앱·학습 현황·일정표(목록·현황 화면)에도 필기
    add(document.querySelectorAll('.gc-month'), 'text');   // 11-10 일정표 달력: 달 블록 하나 = 카드 하나(학생·달로 저장)
    return out;
  }
  // 뿌리의 자식 가운데 필기 카드가 될 것 — 달력(.gc-month)을 품은 칸은 통째로 붙이지 않고 그 안의 .card만(달력은 달 블록으로 따로)
  const kids = root => { const out = []; for (const x of root.children) { if (x.nodeType !== 1 || x.matches(SKIP)) continue; if (x.querySelector('.gc-month')) { for (const c of x.querySelectorAll('.card')) if (!c.querySelector('.gc-month') && !c.closest('.gc-wrap')) out.push(c); } else out.push(x); } return out; };
  const vis = el => el.getClientRects().length > 0;
  function norm(el) {   // 카드의 내용 지문(指紋): 그림·음원 파일 이름 + 글자(빈칸에 쓴 답·글상자는 들어가지 않는다)
    let t = ''; el.querySelectorAll('[data-enc],img[src]').forEach(i => { const k = i.dataset.enc || i.getAttribute('src') || ''; if (k && !/^(blob|data):/.test(k)) t += k + '|'; });
    return t + (el.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function hash(s) { let a = 2166136261, b = 5381; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = (Math.imul(b, 33) + c) | 0; } return (a >>> 0).toString(36) + (b >>> 0).toString(36); }
  const sigs = new WeakMap();
  function ident(el, kind) {   // {id, …} — 글 카드는 내용이 그대로면 다시 계산하지 않는다
    if (kind === 'book') return {id: `${SALT}:${PAGE}:${(location.hash.match(/^#g(\d+)/) || [])[1]}:${el.id}:${NARROW.matches ? 'm' : 'w'}`};
    if (kind === 'img') return {id: `${SALT}:${PAGE}:${BOOK}:p${el.dataset.p || new URLSearchParams(location.search).get('p') || 1}`};
    if (el.classList.contains('gc-month')) return {id: `${SALT}:${PAGE}:cal:${(el.closest('.gc-wrap') || {dataset: {}}).dataset.ink || ''}:${el.id}`};   // 일정표: 학생·달로 고정(내용이 바뀌어도 같은 카드)
    const sig = (el.textContent || '').length + '/' + el.querySelectorAll('[data-enc],img[src]').length, old = sigs.get(el);
    if (old && old.sig === sig) return old;
    // head = 첫머리(「3. 주제」처럼 번호+유형 두 글자, 번호가 없으면 24자), probes = 본문 가운데 두 토막. 채점으로 해설·정오 표시가 덧붙어도 토막은 남는다 → 같은 카드로 본다
    const n = norm(el), L = n.length, v = {sig, n, id: `${SALT}:${PAGE}:t:${hash(n)}:${NARROW.matches ? 'm' : 'w'}`, head: (n.match(/^\d+\s*[.)]\s*\S{0,2}/) || [n.slice(0, 24)])[0], probes: [n.substr(L / 3 | 0, 40), n.substr(2 * L / 3 | 0, 40)]};
    sigs.set(el, v); return v;
  }
  const same = (c, v) => c.probes.some(p => v.n.includes(p));
  const blank = (id, kind) => ({id, salt: SALT, page: PAGE, kind, w: 0, s: []});
  const tag = (c, v) => { c.sig = v.sig; c.head = v.head || ''; c.probes = v.probes || ['']; c.len = v.n ? v.n.length : 0; return c; };
  function mount(el, kind, q, v) { const c = tag(INK.mount(el, kind, q), v); cards.set(el, c); return c; }
  function unmount(c) { INK.unmount(c); cards.delete(c.el); }

  function sync() {
    stimer = 0; cand = candidates(); const gone = [];   // 같은 문항이 새로 그려지면(채점 뒤 다시 그리기) 필기를 넘겨준다
    for (const [el, c] of [...cards]) {
      if (cand.has(el) && el.isConnected && c.svg.parentNode === el) continue;
      if (c.kind === 'text' && c.q.s.length && c.len >= 40) gone.push(c);
      unmount(c);
    }
    let any = false;
    for (const [el, kind] of cand) {
      if (!any && vis(el)) any = true;
      const c = cards.get(el), v = ident(el, kind);
      if (c) {
        if (INK.busy()) continue;
        if (kind === 'img') { if (v.id !== c.q.id) INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); }
        else if (kind === 'text' && v.sig !== c.sig) { const keepIt = same(c, v); if (keepIt) c.sig = v.sig; else { INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); tag(c, v); } }   // 카드는 그대로인데 속 내용이 통째로 바뀐 경우
        continue;
      }
      let q = recs.get(v.id);
      if (!q && kind === 'text') { const g = gone.find(g => g.head === v.head && g.q.id !== v.id && g.probes.every(p => v.n.includes(p))); if (g) { q = {...g.q, id: v.id, s: g.q.s.map(s => ({...s, p: s.p.slice()}))}; save(q); } }
      if (q) mount(el, kind, q, v);
    }
    INK.bar(any);
  }
  const schedule = () => { if (!stimer) stimer = setTimeout(sync, 60); };
  const ours = n => n.nodeType === 1 && n.matches && n.matches(INKSEL);
  const mine = m => {
    const t = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (t && t.closest(INKSEL)) return true;
    if (m.type === 'childList') { const ns = [...m.addedNodes, ...m.removedNodes]; return ns.length > 0 && ns.every(ours); }
    return false;
  };
  new MutationObserver(ms => { if (!ms.every(mine)) schedule(); }).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'src']});
  addEventListener('hashchange', schedule); addEventListener('popstate', schedule);
  NARROW.addEventListener('change', async () => { await flush(); [...cards.values()].forEach(unmount); sync(); INK.status('이 방향에서 쓴 필기만 보입니다'); });

  INK.init({
    save: c => save(c.q), onPen: schedule,
    cardAt(t) {   // 펜이 닿은 자리의 카드 — 필기가 없던 카드는 이때 필기층을 만든다
      cand = candidates(); let el = null; for (let n = t; n && n !== document.body; n = n.parentElement) if (cand.has(n)) { el = n; break; }
      if (!el) return null;
      let c = cards.get(el); if (c && c.svg.parentNode !== el) { unmount(c); c = null; }
      if (!c) { const kind = cand.get(el), v = ident(el, kind); c = mount(el, kind, recs.get(v.id) || blank(v.id, kind), v); }
      return c;
    },
  });
  window.BOOKNOTE = {dump: () => tx('readonly', s => s.index('salt').getAll(SALT)), cards: () => cards.size};
  load().then(sync);
})();
</script>
<script id="tdevJs">
/* 선생님 기기 자동 등록(2026-11-10 사용자: 아이패드가 앱마다 「다른 학생 이름으로 등록」으로 막힘 → 「모든 앱을 고쳐」).
   기기ID는 앱·홈 화면 앱마다 따로 생긴다. 이 브라우저에 선생님 코드가 있으면 저장소의 모든 기기ID를 서버(tdev)에 등록해 이름 잠금·경고에서 뺀다.
   코드가 없는 기기는 이름 칸에 선생님 코드를 한 번 치면 등록된다(코드는 서버가 확인, 화면·주소에 남기지 않는다). tdev_all.py가 게시 때마다 끼운다. */
(function () {
  var U = 'https://script.google.com/macros/s/AKfycbyKGf4h-cdSKteg8QPTjZTvUVsbowp4S0WvaRuyzjFq4Xwm1nc9mOKl70P0tqKzyOKm/exec', RX = /^[A-Za-z0-9.-]{3,40}$/, busy = false, tries = 0, bad = {};
  function val(k) { var v = null; try { v = localStorage.getItem(k); v = JSON.parse(v); } catch (e) {} return typeof v === 'string' ? v : ''; }
  function keys(re) { var a = []; try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (re.test(k)) a.push(k); } } catch (e) {} return a; }
  function ids() { var a = []; keys(/(^|:)device$/).forEach(function (k) { var v = val(k); if (RX.test(v) && a.indexOf(v) < 0) a.push(v); }); return a.sort(); }
  function codes() { var a = []; ['leess:tcode'].concat(keys(/(^|:)tcode$/)).forEach(function (k) { var v = val(k); if (v && a.indexOf(v) < 0) a.push(v); }); return a; }
  function post(code, devs) {
    return fetch(U, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({event: 'tdev', code: code, devs: devs})})
      .then(function (r) { return r.text(); }).then(function (t) { try { return !!JSON.parse(t).ok; } catch (e) { return false; } }).catch(function () { return null; });
  }
  function sync(codeIn) {   // true = 등록됨
    var devs = ids(), sig = devs.join(',');
    if (!devs.length || busy) return Promise.resolve(false);
    var cs = codeIn ? [codeIn] : codes().filter(function (c) { return bad[c] !== sig; });
    if (!cs.length) return Promise.resolve(false);
    if (!codeIn && val('leess:tcode') && localStorage.getItem('leess:tdevs') === sig) return Promise.resolve(true);
    busy = true;
    var i = 0;
    function next() {
      if (i >= cs.length) return false;
      var c = cs[i++];
      return post(c, devs).then(function (ok) {
        if (ok) { try { localStorage.setItem('leess:tdevs', sig); localStorage.setItem('leess:tcode', JSON.stringify(c)); } catch (e) {} return true; }
        if (ok === false) bad[c] = sig;
        return next();
      });
    }
    return Promise.resolve(next()).then(function (r) { busy = false; return r; }, function () { busy = false; return false; });
  }
  var t1 = 0, t2 = 0;
  function later() { clearTimeout(t1); t1 = setTimeout(function () { sync(); }, 900); }
  function isName(el) { return el && el.tagName === 'INPUT' && (el.id === 'name' || /이름/.test(el.getAttribute('placeholder') || '')); }
  document.addEventListener('input', function (e) {   // 이름 칸에 선생님 코드를 치면 등록
    var el = e.target; if (!isName(el)) return;
    clearTimeout(t2);
    t2 = setTimeout(function () {
      var v = (el.value || '').trim();
      if (!/^[!-~]{4,40}$/.test(v) || tries >= 6) return;
      tries++;
      sync(v).then(function (ok) { if (ok && (el.value || '').trim() === v) { el.value = ''; try { el.dispatchEvent(new Event('input', {bubbles: true})); } catch (e) {} alert('선생님 기기로 등록했습니다. 이제 학생 이름으로 들어가시면 됩니다.'); } });
    }, 700);
  }, true);
  document.addEventListener('click', later, true);   // 앱 안에서 코드를 넣은 직후(일곱 번 누르기 등)에도 바로 등록
  document.addEventListener('visibilitychange', function () { if (!document.hidden) later(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', later); else later();
  setTimeout(function () { sync(); }, 3000);
})();
</script>
