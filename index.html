<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>학습 현황</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#1c1d21;--sub:#6b6d75;--line:#e2e1db;--acc:#7a1f3d;--acc2:#f6e9ee;--box:#efeee8;--ok:#1f8a4c;--ok2:#e2f3e8;--go:#b5560b;--go2:#fdf0e3;--red:#b42318;--red2:#fde8e8;--h0:#f0efe9;--h1:#cfe8d8;--h2:#8fcca6;--h3:#3f9e66;--h4:#1f6b40}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:10px 16px 80px}
button{font:inherit;border:0;border-radius:9px;padding:8px 12px;background:var(--box);color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);color:#fff;font-weight:600}
input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.top h1{font-size:20px;margin:0 auto 0 0}
.back{display:inline-block;margin:2px 0 6px;color:var(--sub);text-decoration:none;font-size:14px}
.datebar{display:flex;align-items:center;gap:6px}
.datebar b{min-width:118px;text-align:center}
.muted{color:var(--sub);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.tile .n{font-size:24px;font-weight:700;line-height:1.2}.tile .l{font-size:12.5px;color:var(--sub)}
.tile.on{outline:2px solid var(--acc)}
.tabs{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.tabs button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.gh{font-weight:700;margin:14px 2px 6px;font-size:14px;color:var(--acc)}
.row{display:grid;grid-template-columns:200px 1fr 190px 112px;gap:10px;align-items:center;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 6px;cursor:pointer}
.row:hover{border-color:#c9a7b3}
.nm b{font-size:15.5px}.nm .muted{display:block;font-size:12px}
.bar{height:8px;background:var(--box);border-radius:5px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:20px;background:var(--box);color:var(--sub);white-space:nowrap}
.chip.ok{background:var(--ok2);color:var(--ok)}.chip.go{background:var(--go2);color:var(--go)}.chip.no{background:var(--red2);color:var(--red)}
.heat{display:flex;gap:2px}.heat span{width:14px;height:14px;border-radius:3px;background:var(--h0);font-size:9px;line-height:14px;text-align:center;color:#fff}
.heat span.t{outline:1.5px solid var(--acc);outline-offset:0}
.l0{background:var(--h0)!important}.l1{background:var(--h1)!important;color:#245!important}.l2{background:var(--h2)!important}.l3{background:var(--h3)!important}.l4{background:var(--h4)!important}
.last{text-align:right;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--sub);font-weight:600;background:#faf9f6;position:sticky;top:0}
td.num,th.num{text-align:right}
.grid{overflow-x:auto}
.grid td.c{width:30px;text-align:center;padding:4px 2px}
.grid td.c span{display:inline-block;min-width:24px;height:22px;line-height:22px;border-radius:5px;font-size:12px;background:var(--h0);color:var(--ink)}
.grid tr:hover td{background:#fbf7f8}
.grid td.nmc{white-space:nowrap;cursor:pointer}
.task{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}
.ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;margin-top:2px}
.ck.on{background:var(--ok);border-color:var(--ok)}
.tag{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:5px;margin-right:5px;background:var(--acc2);color:var(--acc);font-weight:600}
.tk .d{font-size:12.5px;color:var(--sub)}
.sec{font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details summary{cursor:pointer;color:var(--sub);font-size:12.5px}
pre{white-space:pre-wrap;font:12.5px/1.5 inherit;margin:4px 0;background:#faf9f6;padding:6px 8px;border-radius:6px}
.err{color:var(--red);font-size:14px;margin:6px 0}
.spark{width:100%;height:70px}
.note{font-size:12.5px;color:var(--sub);margin:6px 2px}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}.filt button{padding:5px 10px;font-size:13px}.filt button.on{background:var(--ink);color:#fff}
@media (max-width:760px){
 .tiles{grid-template-columns:repeat(2,1fr)}
 .row{grid-template-columns:1fr auto;gap:4px 10px}
 .row .hc{grid-column:1/-1}.row .tc{grid-column:1/-1}
 .two{grid-template-columns:1fr}
}
.hd{display:flex;gap:12px;align-items:center;margin:2px 0 4px}.av{width:62px;height:62px;border-radius:16px;background:var(--box);flex:none;display:grid;place-items:center;overflow:hidden;font-size:26px;font-weight:700;color:var(--sub)}.av img{width:100%;height:100%;object-fit:contain}.hd h2{font-size:20px;margin:0;line-height:1.3}
.nmc{display:flex;align-items:center;gap:8px}.nmc>div{display:flex;flex-direction:column;min-width:0}.nav{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:#f1f0ec}.nav0{display:flex;align-items:center;justify-content:center;font-weight:800;color:#888;font-size:13px}
.row.fresh{background:#fff8db;box-shadow:inset 4px 0 0 #f59f00}
</style>

  try {
    var q = new URLSearchParams(location.search), dv = q.get('dv');
    if (dv === null && !q.has('openExternalBrowser')) return;
    var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

    ['dv', 'via', 'openExternalBrowser'].forEach(function (k) { q.delete(k); });
    var s = q.toString();
    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
  } catch (e) {}
})();
</script>

  return h + '<p class="note">오늘 할 일 체크: 시험앱·워크북은 서버 기록으로 자동 판정, 학생이 직접 누르는 칸은 11-01부터 서버에 남은 체크만 보입니다. 워크북 1단계(읽기)·4단계(해석)는 11-01부터 서버에 남은 완료만 보입니다.</p>';
}

function vWeek(names) {
  const days = []; for (let i = 13; i >= 0; i--) days.push(addD(DAY, -i));
  let h = `<div class="card grid"><table><tr><th>학생</th>${days.map(d => `<th class="num" title="${d}">${+d.slice(8)}<br><span class="muted">${W[pd(d).getDay()]}</span></th>`).join('')}<th class="num">합계</th><th class="num">평균</th></tr>`, cur = '';
  for (const n of names) {
    const g = grp(n); if (g !== cur) { h += `<tr><td colspan="${days.length + 3}" class="gh" style="border:0;padding-top:10px">${esc(g)}</td></tr>`; cur = g; }
    const all = days.map(d => gDay(n, d)), flat = all.flat();
    h += `<tr><td class="nmc" data-who="${esc(n)}"><b>${esc(n)}</b></td>${all.map((L, i) => { const b = L.length ? Math.max(...L.map(x => +x.score || 0)) : ''; return `<td class="c"><span class="${lvl(L.length)}" title="${days[i]} ${L.length}회${L.length ? ' · 최고 ' + b + '점' : ''}">${L.length || ''}</span></td>`; }).join('')}<td class="num">${flat.length}</td><td class="num">${flat.length ? avg(flat.map(x => +x.score || 0)) : ''}</td></tr>`;
  }
  return h + '</table></div><p class="note">칸 숫자 = 그날 채점된 시험·워크북 단계 수(색이 진할수록 많음). 이름을 누르면 학생 화면.</p>';
}

function vApps() {
  const from = addD(DAY, -13), m = {};
  for (const n in BY) for (const x of G(n)) { if (x.t.slice(0, 10) < from || x.t.slice(0, 10) > DAY) continue; const a = m[x.app] = m[x.app] || {n: 0, s: [], who: {}}; a.n++; a.s.push(+x.score || 0); a.who[n] = (a.who[n] || 0) + 1; }
  const L = Object.entries(m).sort((a, b) => b[1].n - a[1].n);
  if (!L.length) return '<div class="card muted">최근 14일 기록이 없습니다.</div>';
  return `<div class="card grid"><table><tr><th>앱(최근 14일)</th><th class="num">학생</th><th class="num">응시</th><th class="num">평균</th><th>누가 몇 번</th></tr>${L.map(([t, a]) => `<tr><td>${esc(sname(t))}</td><td class="num">${Object.keys(a.who).length}</td><td class="num">${a.n}</td><td class="num">${avg(a.s)}</td><td class="muted">${Object.entries(a.who).sort((x, y) => y[1] - x[1]).map(([n, c]) => `<a href="#" data-who="${esc(n)}">${esc(n)}</a> ${c}`).join(' · ')}</td></tr>`).join('')}</table></div>`;
}

function spark(L) {
  if (L.length < 2) return '';
  const W0 = 600, H0 = 70, xs = i => 6 + i * (W0 - 12) / (L.length - 1), ys = v => H0 - 6 - (v / 100) * (H0 - 12);
  const p = L.map((x, i) => `${xs(i).toFixed(1)},${ys(+x.score || 0).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W0} ${H0}" preserveAspectRatio="none"><line x1="0" x2="${W0}" y1="${ys(90)}" y2="${ys(90)}" stroke="#1f8a4c" stroke-dasharray="4 4" stroke-width="1"/><polyline points="${p}" fill="none" stroke="#7a1f3d" stroke-width="2"/>${L.map((x, i) => `<circle cx="${xs(i).toFixed(1)}" cy="${ys(+x.score || 0).toFixed(1)}" r="2.6" fill="${+x.score >= 90 ? '#1f8a4c' : '#b5560b'}"><title>${esc(x.t)} ${esc(sname(x.app))} ${x.score}점</title></circle>`).join('')}</svg>`;
}

function vStudent(n) {
  if (!n || !ST[n]) return '<div class="card muted">학생을 고르세요.</div>';
  const s = ST[n], T = tasks(n, DAY), all = G(n);
  const pick = `<select id="whoSel" style="font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line)">${roster().map(x => `<option${x === n ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  const ex = s.ex && s.ex.d ? `${esc(s.ex.t || '시험')} ${esc(s.ex.d)}${s.ex.est ? '(예정)' : ''} · D-${Math.round((pd(s.ex.d) - pd(DAY)) / 864e5)}` : '시험 일정 없음';
  let h = `<div class="card"><div class="sec"><span>${pick} <span class="muted">${esc(grp(n))}</span></span><span class="muted">${ex} · 기기 ${(SRV.dev || {})[n] || 0}대</span></div>
    ${(s.st || []).length ? `<div class="muted">전략: ${s.st.map(esc).join(' / ')}</div>` : ''}</div>`;
  /* 11-06 사용자: 학생 고르기·전략 칸을 캐릭터 칸 위로 */
  h += `<div class="card"><div class="hd"><div class="av">${s.ch ? `<img src="${s.ch}" alt="">` : esc(n.slice(-2))}</div><div style="min-width:0"><h2 id="nkWho"></h2><div class="muted">${esc([s.sch, s.gr].filter(Boolean).join(' · '))}</div></div></div></div>`;
  h += `<div class="two"><div class="card"><div class="sec"><span>${md(DAY)} 오늘 할 일</span><span class="muted">${T.filter(t => t.ok).length}/${T.length}${opened(n, DAY) ? ' · 앱 열어 봄' : ''}</span></div>${T.length ? T.map(t => `<div class="task"><span class="ck${t.ok ? ' on' : ''}">${t.ok ? '✓' : ''}</span><div class="tk"><div><span class="tag">${esc(t.tag[0])}</span>${esc(t.t)}</div>${t.man ? `<div class="d">${t.ok ? '학생이 직접 체크함 ✓' : '학생 직접 체크 칸 — 아직 안 누름'}</div>` : t.chip ? `<div class="d">${esc(t.chip[1])}</div>` : ''}</div></div>`).join('') : '<div class="muted">이날 할 일이 없습니다.</div>'}</div>`;
  const days = []; for (let i = 27; i >= 0; i--) days.push(addD(DAY, -i));
  h += `<div class="card"><div class="sec"><span>최근 4주</span><span class="muted">${all.length}회(60일)</span></div><div class="heat" style="flex-wrap:wrap;gap:3px">${days.map(d => { const c = gDay(n, d).length; return `<span class="${lvl(c)}${d === DAY ? ' t' : ''}" style="width:22px;height:22px;line-height:22px;font-size:11px" title="${d} ${c}회">${c || ''}</span>`; }).join('')}</div>
    <div style="margin-top:10px" class="muted">점수 추이(최근 40회, 점선 90점)</div>${spark(all.slice(-40)) || '<div class="muted">기록이 2회 미만입니다.</div>'}</div></div>`;
  const ap = {}; for (const x of all) { const a = ap[x.app] = ap[x.app] || {s: [], last: '', p90: 0}; a.s.push(+x.score || 0); a.last = x.t; if (+x.score >= 90) a.p90++; }
  const wt = {}; for (const x of all) for (const p of x.wrong.split(' · ')) { const m = p.match(/^(.+?) (\d+)$/); if (m && +m[2] > 0) wt[m[1]] = (wt[m[1]] || 0) + +m[2]; }
  h += `<div class="two"><div class="card grid"><div class="sec">앱별 기록(60일)</div><table><tr><th>앱</th><th class="num">응시</th><th class="num">평균</th><th class="num">최고</th><th class="num">90+</th><th>마지막</th></tr>${Object.entries(ap).sort((a, b) => a[1].last < b[1].last ? 1 : -1).map(([t, a]) => `<tr><td>${esc(sname(t))}</td><td class="num">${a.s.length}</td><td class="num">${avg(a.s)}</td><td class="num">${Math.max(...a.s)}</td><td class="num">${a.p90}</td><td class="muted">${esc(ago(a.last))}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">기록 없음</td></tr>'}</table></div>
    <div class="card"><div class="sec">많이 틀린 유형(60일)</div>${Object.entries(wt).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) => `<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>${esc(k)}</span><b>${v}</b></div>`).join('') || '<div class="muted">기록 없음</div>'}</div></div>`;
  const rec = all.slice(-30).reverse();
  h += `<div class="card grid"><div class="sec">최근 기록 ${rec.length}건</div><table><tr><th>시각</th><th>앱 · 범위</th><th class="num">점수</th><th>틀린 유형</th></tr>${rec.map(x => `<tr><td class="muted" style="white-space:nowrap">${esc(x.t.slice(5))}</td><td>${esc(sname(x.app))}<div class="muted">${esc(x.range)}${x.dur ? ' · ' + esc(x.dur) : ''}</div>${x.items ? `<details><summary>틀린 문제 보기</summary><pre>${esc(x.items)}</pre></details>` : ''}</td><td class="num"><b style="color:${+x.score >= 90 ? 'var(--ok)' : +x.score >= 70 ? 'var(--go)' : 'var(--red)'}">${x.score}</b></td><td class="muted">${esc(x.wrong)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">기록 없음</td></tr>'}</table></div>`;
  return h;
}

async function load(force) {
  const code = getCode();
  if (!code) { $('#main').hidden = true; $('#login').hidden = false; return; }
  $('#stamp').textContent = '기록을 불러오는 중… (10초쯤 걸립니다)';
  let r, txt = '';
  try { txt = await (await fetch(DD.url + '?dash=' + encodeURIComponent(code) + '&days=60')).text(); }
  catch (e) { $('#stamp').textContent = '서버에 연결하지 못했습니다. 인터넷을 확인하고 새로고침을 누르세요.'; return; }
  try { r = JSON.parse(txt); }
  catch (e) { $('#stamp').textContent = /수집 스크립트/.test(txt) ? '채점 서버가 아직 옛 판입니다. 「시험앱 공용 서버 코드(학습 현황)_2026-11-01」 파일로 서버를 새 버전 배포한 뒤 새로고침을 누르세요.' : '서버 응답을 읽지 못했습니다. 잠시 뒤 새로고침을 누르세요.'; return; }
  if (!r.ok) {
    if (r.error === 'code') { setCode(''); $('#login').hidden = false; $('#main').hidden = true; $('#codeMsg').textContent = '코드가 맞지 않습니다. 다시 넣어 주세요.'; $('#stamp').textContent = ''; return; }
    $('#stamp').textContent = '서버 오류: ' + (r.error || '알 수 없음') + ' — 서버가 11-01 판으로 배포됐는지 확인하세요.'; return;
  }
  if (!Object.keys(ST).length) {
    try { const o = await openBlob(r.key, DD.enc); ST = o.students; XN = new Set(o.skip || []); } catch (e) { $('#stamp').textContent = '학생 자료를 열지 못했습니다(열쇠 불일치). 학습 현황을 다시 빌드해야 합니다.'; return; }
  }
  SRV = r; index(r.rows);
  $('#login').hidden = true; $('#main').hidden = false;
  $('#stamp').textContent = `서버 기록 ${r.at} 기준 · 최근 60일 ${r.rows.filter(x => x[1] === 'g').length}건 · 학생 자료 ${DD.built} 빌드`;
  render();
}

setInterval(() => { if (!document.hidden && view === 'today' && DAY === ymd(new Date()) && !$('#main').hidden) load(); }, 90000);   /* 11-06: 시험 보면 바로 보이게 */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-f],[data-v],[data-who]'); if (!t) return;
  if (t.dataset.who) { e.preventDefault(); who = t.dataset.who; view = 'student'; }
  else if (t.dataset.f) { filt = t.dataset.f; view = 'today'; }
  else if (t.dataset.v) view = t.dataset.v;
  render(); window.scrollTo(0, 0);
});
document.addEventListener('change', e => { if (e.target.id === 'whoSel') { who = e.target.value; render(); } });
$('#prev').onclick = () => { DAY = addD(DAY, -1); render(); };
$('#next').onclick = () => { if (DAY < ymd(new Date())) { DAY = addD(DAY, 1); render(); } };
$('#today').onclick = () => { DAY = ymd(new Date()); render(); };
$('#reload').onclick = () => load(true);
$('#codeGo').onclick = () => { const v = $('#code').value.trim(); if (!v) return; setCode(v); $('#codeMsg').textContent = ''; load(true); };
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') $('#codeGo').click(); });
if (!(window.crypto && crypto.subtle && typeof DecompressionStream !== 'undefined')) $('#stamp').textContent = '이 브라우저에서는 열 수 없습니다. 사파리·크롬 최신판으로 여세요.';
else load();
</script>

    if (deferred) return '<p>아래 버튼을 누르고 <b>설치</b>를 누르면 끝입니다.</p><button type="button" class="pwa-go" id="pwaInstall">앱 설치</button>';
    if (v.k === 'samsung') return '<ol><li>화면 아래 <b>≡</b> 메뉴를 누르세요.</li><li><b>페이지 추가</b>(또는 <b>현재 페이지 추가</b>) → <b>홈 화면</b>을 누르세요.</li><li><b>추가</b>를 누르면 끝입니다.</li></ol>';
    if (v.k === 'android') return '<ol><li>오른쪽 위 <b>⋮</b> 메뉴를 누르세요.</li><li><b>홈 화면에 추가</b>(또는 <b>앱 설치</b>)를 누르세요.</li><li><b>설치</b>(또는 <b>추가</b>)를 누르면 끝입니다.</li></ol>';
    return '<p>휴대폰에서 이 주소를 열어 추가하세요. 컴퓨터(크롬·엣지)에서는 주소창 오른쪽의 <b>설치</b> 아이콘을 누르면 됩니다.</p>';
  }
  function show(v) {
    var real = !v; v = v || env();
    $('pwaBody').innerHTML = body(v);
    var out = $('pwaOut'), ins = $('pwaInstall');
    if (out) out.onclick = function () { location.href = v.k === 'kakao' ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(outUrl()) : outUrl('openExternalBrowser=1'); };
    if (ins) ins.onclick = function () { var p = deferred; deferred = null; p.prompt(); p.userChoice.then(function (c) { if (c.outcome === 'accepted') hide(); }).catch(function () {}); };
    if (real && v.k === 'ios' && dev() && saved === null) { saved = location.href; history.replaceState(history.state, '', base + '?dv=' + dev()); }   // 아이폰: 추가할 때의 주소에 기기ID
    $('pwaSheet').hidden = false;
  }
  function hide() { $('pwaSheet').hidden = true; if (saved !== null) { history.replaceState(history.state, '', saved); saved = null; } }
  window.PWA = {env: env, show: function (u) { show(env(u)); }};   // 점검용: PWA.show('… KAKAOTALK …')
  $('pwaClose').onclick = hide;
  $('pwaSheet').addEventListener('click', function (e) { if (e.target === this) hide(); });
  var home = $('home'), bar = $('pwaBar'), link = $('pwaLink'), notice = $('notice');
  if (app || !home) return;
  home.insertBefore(bar, notice && notice.parentNode === home ? notice.nextSibling : home.firstChild);
  home.appendChild(link);
  var off = false; try { off = localStorage.getItem(HIDE) === '1'; } catch (e) {}
  bar.hidden = off || env().k === 'pc';
  link.hidden = false;
  $('pwaHow').onclick = link.onclick = function () { show(); };
  $('pwaX').onclick = function () { bar.hidden = true; try { localStorage.setItem(HIDE, '1'); } catch (e) {} };
  addEventListener('appinstalled', function () { bar.hidden = link.hidden = true; hide(); });
})();
</script>

<script>/* 통합앱에서 열었을 때만 맨 위에 「‹ 전체 앱」(hubback.py) */
(function () {
  var u; try { u = sessionStorage.getItem('hub:back'); } catch (e) {}
  if (!u || u.indexOf(location.origin + '/') !== 0) return;
  var box = document.createElement('div'), a = document.createElement('a');
  box.setAttribute('style', 'max-width:780px;margin:0 auto;padding:10px 16px 0');
  a.id = 'hubBack'; a.href = u; a.textContent = '‹ 전체 앱';
  a.setAttribute('style', 'display:inline-block;padding:6px 14px 6px 10px;border:1px solid var(--line,#e1e0da);border-radius:999px;background:var(--card,#fff);color:var(--acc,#2f5bd3);font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-decoration:none');
  a.onclick = function (e) {
    var t = document.getElementById('test'), h = document.getElementById('home');   // 시험 화면이 있는 앱은 그것으로, 없으면 첫 화면이 보이는지로
    var idle = t ? (t.hidden || t.offsetParent === null) : (!!h && !h.hidden && h.offsetParent !== null);
    if (!idle && !confirm('전체 앱 목록으로 돌아갈까요?\n지금 푸는 문제는 이어서 풀 수 없을 수도 있습니다.')) e.preventDefault();
  };
  box.appendChild(a);
  document.body.insertBefore(box, document.body.firstChild);
  // 선생님 앱(leess-teacher)에서 왔으면 선생님 화면을 바로 연다(코드는 선생님 앱이 이 앱의 코드 자리에 넣어 두었다). 한 번만.
  var tf; try { tf = sessionStorage.getItem('hub:teacher'); sessionStorage.removeItem('hub:teacher'); } catch (e) {}
  var tb = document.getElementById('teacherBtn');
  if (tf === '1' && tb && !tb.hidden) tb.click();
})();
</script>
